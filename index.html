<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#E9EEF8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냉파">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>냉파</title>
<style>
:root{
  --bg:#E9EEF8; --surface:#fff; --surface-2:#F2F5FC; --line:#E3E8F3;
  --text:#18213D; --text-2:#5A6483;
  --primary:#3D7BF2; --primary-soft:#E7EFFE; --primary-text:#2B62D6; --on-primary:#fff;
  --red:#C8262E; --red-bg:#FFE5E5; --orange:#B0470A; --orange-bg:#FFEBDC; --yellow:#7A5800; --yellow-bg:#FFF1BF;
  --shadow:0 10px 30px rgba(46,89,170,.08); --shadow-p:0 12px 24px rgba(61,123,242,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0E1322; --surface:#182036; --surface-2:#212A44; --line:#2A3452;
  --text:#E8ECF7; --text-2:#A5AFC8;
  --primary:#4F87F5; --primary-soft:#22335C; --primary-text:#9DBDFF; --on-primary:#fff;
  --red:#FF8A8F; --red-bg:#4A1E26; --orange:#FFB37A; --orange-bg:#47291A; --yellow:#F3D46B; --yellow-bg:#3F3518;
  --shadow:0 10px 30px rgba(0,0,0,.25); --shadow-p:0 12px 24px rgba(30,80,200,.4);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#0E1322; --surface:#182036; --surface-2:#212A44; --line:#2A3452;
  --text:#E8ECF7; --text-2:#A5AFC8;
  --primary:#4F87F5; --primary-soft:#22335C; --primary-text:#9DBDFF; --on-primary:#fff;
  --red:#FF8A8F; --red-bg:#4A1E26; --orange:#FFB37A; --orange-bg:#47291A; --yellow:#F3D46B; --yellow-bg:#3F3518;
  --shadow:0 10px 30px rgba(0,0,0,.25); --shadow-p:0 12px 24px rgba(30,80,200,.4);
  color-scheme:dark;
}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(120px + env(safe-area-inset-bottom))}

/* header */
.top{background:var(--surface);border-radius:0 0 32px 32px;padding:calc(env(safe-area-inset-top) + 22px) 20px 22px;box-shadow:var(--shadow)}
.top-row{display:flex;align-items:center;gap:10px}
.top-row>div{flex:1;min-width:0}
.eyebrow{margin:0;font-size:.8rem;color:var(--text-2)}
.brand{margin:2px 0 0;font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:.85rem;font-weight:500;color:var(--text-2);margin-left:4px}
.icon-btn{position:relative;flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--text)}
.icon-btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-p)}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font:700 .7rem/20px inherit;font-style:normal;border:2px solid var(--surface)}
.label{margin:22px 0 12px;font-size:.9rem;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-size:1.45rem;font-weight:700}
.stats span{font-size:.8rem;color:var(--text-2)}
.t-red{color:var(--red)}.t-orange{color:var(--orange)}.t-yellow{color:var(--yellow)}

/* search + tabs */
.search{display:flex;align-items:center;gap:10px;margin:20px 16px 0;padding:0 16px;height:50px;background:var(--surface);border-radius:16px;color:var(--text-2);box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:1rem;color:var(--text)}
.tabs{display:flex;gap:4px;margin:16px 16px 0}
.tabs button{flex:1;padding:10px 0 14px;font-size:.95rem;color:var(--text-2);position:relative;border-radius:12px}
.tabs button small{font-size:.75rem;margin-left:2px}
.tabs button[aria-selected=true]{color:var(--text);font-weight:700}
.tabs button[aria-selected=true]::after{content:'';position:absolute;left:50%;bottom:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--primary)}

/* banner */
.banner{display:flex;align-items:center;gap:14px;margin:14px 16px 0;padding:18px 20px;border-radius:24px;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-p)}
.banner div{flex:1}
.banner b{display:block;font-size:1.05rem}
.banner span{font-size:.8rem;opacity:.9}
.banner i{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#3D7BF2}

/* sections + cards */
.sec{margin:26px 16px 0}
.sec h2{display:flex;align-items:baseline;gap:6px;margin:0 4px 12px;font-size:1.05rem}
.sec h2 small{color:var(--primary-text);font-size:.9rem}
.sec h2 span{margin-left:auto;font-size:.78rem;font-weight:500;color:var(--text-2)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.none{margin:0;padding:22px;text-align:center;border-radius:20px;background:var(--surface);color:var(--text-2);font-size:.9rem;box-shadow:var(--shadow)}
.swipe{position:relative;border-radius:20px;overflow:hidden}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700;color:#fff;opacity:0}
.swipe-bg span{display:flex;align-items:center;gap:6px}
.swipe[data-dir] .swipe-bg{opacity:1}
.swipe[data-dir=consume] .swipe-bg{background:var(--primary)}
.swipe[data-dir=consume] .swipe-bg span:last-child,.swipe[data-dir=discard] .swipe-bg span:first-child{visibility:hidden}
.swipe[data-dir=discard] .swipe-bg{background:#D9363E}
.card{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px 14px 14px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);touch-action:pan-y;-webkit-user-drag:none;user-select:none;transition:transform .2s ease}
.card.dragging{transition:none}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-text)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.meta strong{font-size:1rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{font-size:.8rem;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;padding:5px 10px;border-radius:10px;font-size:.82rem;font-weight:700;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.orange{background:var(--orange-bg);color:var(--orange)}
.badge.yellow{background:var(--yellow-bg);color:var(--yellow)}
.hint-swipe{margin:22px 0 0;text-align:center;font-size:.78rem;color:var(--text-2)}

/* empty */
.empty{margin:28px 16px 0;padding:36px 24px;text-align:center;background:var(--surface);border-radius:28px;box-shadow:var(--shadow)}
.empty .ico{width:72px;height:72px;border-radius:24px;margin:0 auto 16px}
.empty h2{margin:0 0 6px;font-size:1.15rem}
.empty p{margin:0 0 22px;color:var(--text-2);font-size:.9rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:52px;padding:0 20px;border-radius:16px;font-weight:700;background:var(--surface-2);color:var(--text)}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-p)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.fab{position:fixed;z-index:5;right:max(20px,calc(50vw - 220px));bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-p)}
body:not([data-page=home]) .fab{display:none}

/* sub pages */
.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 16px) 16px 8px}
.bar h1{flex:1;margin:0;text-align:center;font-size:1.1rem}
.bar .icon-btn{background:var(--surface)}
.bar .spacer{width:44px}
.panel{margin:16px;padding:20px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}
.panel>h2{margin:0 0 14px;font-size:1rem}
.note{margin:16px 24px;font-size:.8rem;color:var(--text-2)}

/* detail */
.hero{margin:8px 16px 0;padding:24px 20px;text-align:center;background:var(--surface);border-radius:28px;box-shadow:var(--shadow)}
.ring{position:relative;width:200px;height:200px;margin:0 auto;border-radius:50%;box-shadow:0 20px 50px rgba(61,123,242,.15)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .track{stroke:var(--surface-2)}
.ring .prog{stroke:var(--primary)}
.ring.red .prog{stroke:var(--red)}.ring.orange .prog{stroke:var(--orange)}.ring.yellow .prog{stroke:var(--yellow)}
.ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.ring span{font-size:.85rem;color:var(--text-2)}
.hero-name{margin:16px 0 2px;font-size:1.3rem;font-weight:700;word-break:break-all}
.hero-sub{margin:0;font-size:.85rem;color:var(--text-2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 16px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.tile svg{margin-bottom:10px}
.tile small{font-size:.78rem;color:var(--text-2)}
.tile b{font-size:1.05rem}
.tile.primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-p)}
.tile.primary small{color:inherit;opacity:.85}
.tile.danger{color:var(--red)}
.pill{display:inline-block;margin:10px 0 0;padding:4px 12px;border-radius:999px;background:var(--surface-2);font-size:.8rem;font-weight:600}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:.85rem;font-weight:600;color:var(--text-2)}
.field input,.field textarea{width:100%;height:50px;padding:0 14px;border:1.5px solid transparent;border-radius:14px;background:var(--surface-2);font-size:1rem;font-weight:500;color:var(--text);outline:none}
.field textarea{height:80px;padding:12px 14px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .field{min-width:0}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px;padding:0;border:0}
.picker label{position:relative}
.picker input{position:absolute;opacity:0;inset:0;margin:0}
.picker span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 12px;border-radius:18px;background:var(--surface-2);font-weight:600;font-size:.9rem;color:var(--text-2);transition:background .15s,color .15s}
.picker input:checked+span{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-p)}
.picker input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.hint{margin:-4px 0 14px;font-size:.78rem;color:var(--text-2)}

/* sheet */
dialog#sheet{position:fixed;inset:auto 0 var(--kb,0px);margin:0 auto;width:100%;max-width:480px;max-height:calc(100dvh - var(--kb,0px) - 24px);padding:0;border:0;border-radius:28px 28px 0 0;background:var(--surface);color:var(--text);overflow:auto;overscroll-behavior:contain}
dialog#sheet::backdrop{background:rgba(14,19,34,.45)}
dialog#sheet[open]{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;align-items:center;padding:10px 20px 4px}
.sheet-head h2{flex:1;margin:0;font-size:1.15rem}
.grip{width:40px;height:5px;margin:10px auto 0;border-radius:3px;background:var(--line)}
.sheet-body{padding:12px 20px 0}
.actions{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.3fr;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--surface)}

/* urgent */
.group{margin:22px 16px 0}
.group h2{margin:0 4px 10px;font-size:1rem}
.group h2 small{color:var(--text-2);font-weight:500;margin-left:4px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);cursor:pointer}
.pick input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--primary)}
.bulk{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(46,89,170,.12)}
.link{color:var(--primary-text);font-weight:600;font-size:.9rem;padding:10px 4px}

/* settings */
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .ico{width:40px;height:40px;border-radius:12px}
.set-row>div{flex:1;min-width:0}
.set-row b{display:block;font-size:.95rem;font-weight:600}
.set-row small{font-size:.78rem;color:var(--text-2)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:11px;background:var(--surface-2);font-size:1.2rem;font-weight:700}
.stepper output{min-width:28px;text-align:center;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:16px;background:var(--surface-2)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:block;padding:10px 0;text-align:center;border-radius:12px;font-weight:600;font-size:.9rem;color:var(--text-2)}
.seg input:checked+span{background:var(--surface);color:var(--primary-text);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--primary)}
.set-link{width:100%;text-align:left}
.set-link svg:last-child{color:var(--text-2)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border-radius:16px;background:#18213D;color:#fff;font-size:.9rem;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast button{color:#9DBDFF;font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="식재료 등록"></button>
<dialog id="sheet" aria-labelledby="sheetTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="names"></datalist>
<datalist id="units"><option>개</option><option>g</option><option>kg</option><option>ml</option><option>L</option><option>봉</option><option>팩</option><option>병</option><option>캔</option><option>단</option></datalist>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const STORAGE = { fridge: '냉장', freezer: '냉동', pantry: '상온' };
const ICON = {
  fridge: '<path d="M5 6a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6Z"/><path d="M5 10h14"/><path d="M15 6v1"/><path d="M15 13v3"/>',
  freezer: '<path d="M2 12h20"/><path d="M12 2v20"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/>',
  pantry: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  settings: '<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  close: '<path d="M18 6 6 18M6 6l12 12"/>',
  arrow: '<path d="M5 12h14M12 5l7 7-7 7"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  upload: '<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
};
const svg = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- dates (local calendar day, YYYY-MM-DD) ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => iso(new Date());
const days = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 864e5); // both parse as UTC midnight → whole days
const md = s => { const [y, m, d] = s.split('-').map(Number); return (y !== new Date().getFullYear() ? `${y % 100}.` : '') + `${m}.${d}`; };

/* ---------- state + IndexedDB ---------- */
let items = [];
const S = { expiringThresholdDays: 3, staleThresholdDays: 7, theme: 'system', lastStorage: 'fridge' };
const ui = { tab: 'all', q: '' };
const idb = new Promise((res, rej) => {
  const r = indexedDB.open('naengpa', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const get = async k => { const d = await idb; return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
const put = async (k, v) => { const d = await idb; return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); };
// ponytail: rewrites the whole list per save; fine for hundreds of items, per-item store if it ever grows to thousands
const save = () => Promise.all([put('items', items), put('settings', { ...S })]).catch(() => toast('저장에 실패했어요. 저장 공간을 확인해 주세요.'));
const active = () => items.filter(i => i.status === 'active');
const find = id => items.find(i => i.id === id);

/* ---------- 기한 로직 (PRD 6장) ---------- */
function info(it, t = today()) {
  if (it.expiryDate) {
    const d = days(it.expiryDate, t);
    if (d < 0) return { lvl: 'red', text: `${-d}일 지남`, word: '만료', kind: 'expired' };
    if (d === 0) return { lvl: 'red', text: '오늘까지', word: '오늘 만료', kind: 'soon' };
    if (d <= S.expiringThresholdDays) return { lvl: 'orange', text: `D-${d}`, word: '임박', kind: 'soon' };
    if (d <= 7) return { lvl: 'yellow', text: `D-${d}`, word: '주의' };
    return { lvl: '', text: `D-${d}`, word: '여유' };
  }
  const n = days(t, it.purchasedAt);
  if (n <= 0) return { lvl: '', text: '오늘 구입', word: '' };
  return n >= S.staleThresholdDays
    ? { lvl: 'yellow', text: `구입 ${n}일째`, word: '오래됨', kind: 'stale' }
    : { lvl: '', text: `구입 ${n}일째`, word: '' };
}
const byExpiry = (a, b) => a.expiryDate.localeCompare(b.expiryDate) || a.name.localeCompare(b.name, 'ko');
const byPurchase = (a, b) => a.purchasedAt.localeCompare(b.purchasedAt) || a.name.localeCompare(b.name, 'ko');

// self-check: silent unless the date logic breaks
[['2026-01-09', null, '1일 지남'], ['2026-01-10', null, '오늘까지'], ['2026-01-13', null, 'D-3'], ['2026-01-14', null, 'D-4'],
 [null, '2026-01-10', '오늘 구입'], [null, '2026-01-04', '구입 6일째'], [null, '2026-01-03', '구입 7일째']]
  .forEach(([e, p, want]) => console.assert(info({ expiryDate: e, purchasedAt: p || '2026-01-01' }, '2026-01-10').text === want, 'info', e, p, want));

/* ---------- shared UI bits ---------- */
const picker = sel => `<fieldset class="picker"><legend class="sr">보관 위치</legend>${Object.entries(STORAGE).map(([k, v]) =>
  `<label><input type="radio" name="storage" value="${k}" ${k === sel ? 'checked' : ''}><span>${svg(k, 24)}${v}</span></label>`).join('')}</fieldset>`;
const subline = it => [STORAGE[it.storage], it.quantity ? `${it.quantity}${it.unit || ''}` : '', it.expiryDate ? `${md(it.expiryDate)}까지` : ''].filter(Boolean).join(' · ');
function card(it) {
  const s = info(it), sub = subline(it);
  return `<li class="swipe" data-id="${it.id}">
    <div class="swipe-bg" aria-hidden="true"><span>${svg('check', 20)}소비</span><span>폐기${svg('trash', 20)}</span></div>
    <a class="card" href="#/item/${it.id}" draggable="false" aria-label="${esc(`${it.name}, ${s.word} ${s.text}, ${sub}`)}">
      <span class="ico">${svg(it.storage)}</span>
      <span class="meta"><strong>${esc(it.name)}</strong><small>${esc(sub)}</small></span>
      <span class="badge ${s.lvl}">${s.text}</span>
    </a></li>`;
}
const bar = (title, right = '<span class="spacer"></span>') =>
  `<header class="bar"><button class="icon-btn" data-back aria-label="뒤로">${svg('back')}</button><h1>${title}</h1>${right}</header>`;

let toastTimer;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">되돌리기</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { undo(); el.classList.remove('on'); };
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), undo ? 5000 : 2200);
}

function setStatus(ids, status) {
  const prev = ids.map(id => { const it = find(id); const p = [it, it.status, it.statusChangedAt]; it.status = status; it.statusChangedAt = new Date().toISOString(); return p; });
  save(); render();
  const who = ids.length > 1 ? `${ids.length}개` : prev[0][0].name;
  toast(`${who} ${status === 'consumed' ? '소비' : '폐기'} 처리했어요`, () => {
    prev.forEach(([it, s, t]) => { it.status = s; it.statusChangedAt = t; });
    save(); render();
  });
}

/* ---------- 임박 목록 ---------- */
function urgent() {
  const t = today(), all = active();
  const of = k => all.filter(i => info(i, t).kind === k);
  const groups = [['만료', of('expired').sort(byExpiry)], ['임박', of('soon').sort(byExpiry)], ['오래된 기한 없음', of('stale').sort(byPurchase)]].filter(g => g[1].length);
  const has = groups.length > 0;
  app.innerHTML = `${bar('먼저 먹을 식재료', has ? '<button class="link" data-all>전체 선택</button>' : '<span class="spacer"></span>')}
  ${has ? groups.map(([title, l]) => `<section class="group"><h2>${title}<small>${l.length}</small></h2>${l.map(it => {
    const s = info(it, t);
    return `<label class="pick"><input type="checkbox" value="${it.id}"><span class="ico">${svg(it.storage)}</span><span class="meta"><strong>${esc(it.name)}</strong><small>${esc(subline(it))}</small></span><span class="badge ${s.lvl}">${s.text}</span></label>`;
  }).join('')}</section>`).join('') + `
  <div class="bulk"><button class="btn primary" data-bulk="consumed" disabled>소비</button><button class="btn danger" data-bulk="discarded" disabled>폐기</button></div>`
  : `<div class="empty"><div class="ico">${svg('check', 34)}</div><h2>임박한 식재료가 없어요</h2><p>기한이 ${S.expiringThresholdDays}일 이내이거나 구입한 지 ${S.staleThresholdDays}일 넘은 재료가 여기에 모여요.</p><button class="btn" data-back>홈으로</button></div>`}`;
}
function syncBulk() {
  const n = app.querySelectorAll('.pick input:checked').length;
  app.querySelectorAll('[data-bulk]').forEach(b => { b.disabled = !n; b.textContent = `${b.dataset.bulk === 'consumed' ? '소비' : '폐기'}${n ? ` ${n}개` : ''}`; });
  const all = $('[data-all]'); if (all) all.textContent = n && n === app.querySelectorAll('.pick input').length ? '선택 해제' : '전체 선택';

    <button class="set-row set-link" data-import><span class="ico">${svg('upload', 20)}</span><div><b>백업 가져오기</b><small>내보낸 파일에서 항목을 불러와 합치기</small></div>${svg('chevron', 20)}</button>

  </section>

function applyTheme() {
  const r = document.documentElement;
  S.theme === 'system' ? r.removeAttribute('data-theme') : (r.dataset.theme = S.theme);
  $('meta[name=theme-color]').content = getComputedStyle(r).getPropertyValue('--bg').trim();
}
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'naengpa', version: 1, exportedAt: new Date().toISOString(), items }, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `naengpa-backup-${today()}.json` });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importData(file) {
  const D = /^\d{4}-\d{2}-\d{2}$/, now = new Date().toISOString();
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data?.items;
    const clean = (Array.isArray(list) ? list : [])
      .filter(i => i && typeof i.name === 'string' && i.name.trim() && Object.hasOwn(STORAGE, i.storage) && D.test(i.purchasedAt) && (i.expiryDate == null || D.test(i.expiryDate)))
      .map(i => ({
        id: String(i.id || uid()), name: i.name.trim().slice(0, 50), storage: i.storage, purchasedAt: i.purchasedAt, expiryDate: i.expiryDate || null,
        quantity: Number(i.quantity) > 0 ? Number(i.quantity) : null, unit: String(i.unit || '').slice(0, 10), memo: String(i.memo || '').slice(0, 500),
        status: ['active', 'consumed', 'discarded'].includes(i.status) ? i.status : 'active', statusChangedAt: i.statusChangedAt || null, createdAt: i.createdAt || now,
      }));
    if (!clean.length) throw new Error('empty');
    if (!confirm(`${clean.length}개 항목을 가져올까요?\n같은 항목은 백업 파일 내용으로 바뀌어요.`)) return;
    const map = new Map(items.map(i => [i.id, i]));
    clean.forEach(i => map.set(i.id, i));
    items = [...map.values()];
    await save(); render(); toast(`${clean.length}개 항목을 가져왔어요`);
  } catch { toast('백업 파일을 읽을 수 없어요'); }
}

/* ---------- 이벤트 ---------- */
let navigated = false;
const back = () => navigated ? history.back() : location.replace('#/');
$('#fab').innerHTML = svg('plus', 28);
$('#fab').onclick = openSheet;

app.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) { ui.tab = t.dataset.tab; app.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b === t)); lists(); }
  else if ('add' in t.dataset) openSheet();
  else if ('back' in t.dataset) back();
  else if (t.dataset.act) { const id = location.hash.split('/')[2]; back(); setStatus([id], t.dataset.act); }
  else if ('del' in t.dataset) {
    const id = location.hash.split('/')[2];
    if (confirm('이 항목을 완전히 삭제할까요?\n잘못 등록한 경우에만 사용하고, 먹었거나 버렸다면 소비·폐기를 눌러 주세요.')) { items = items.filter(i => i.id !== id); save(); back(); toast('삭제했어요'); }
  }
  else if (t.dataset.bulk) setStatus([...app.querySelectorAll('.pick input:checked')].map(c => c.value), t.dataset.bulk);
  else if ('all' in t.dataset) { const boxes = [...app.querySelectorAll('.pick input')], on = !boxes.every(c => c.checked); boxes.forEach(c => c.checked = on); syncBulk(); }
  else if (t.dataset.step) {
    const k = t.dataset.step;
    S[k] = Math.min(30, Math.max(1, S[k] + Number(t.dataset.d)));
    save(); settings();
    app.querySelector(`[data-step="${k}"][data-d="${t.dataset.d}"]`).focus();
  }
  else if ('export' in t.dataset) exportData();
  else if ('import' in t.dataset) $('#importFile').click();
});
app.addEventListener('input', e => { if (e.target.id === 'q') { ui.q = e.target.value; lists(); } });
app.addEventListener('change', e => {
  if (e.target.name === 'theme') { S.theme = e.target.value; save(); applyTheme(); }
  if (e.target.closest('.pick')) syncBulk();
});
app.addEventListener('submit', e => {
  if (e.target.id !== 'editForm') return;
  e.preventDefault();
  const f = e.target.elements, it = find(location.hash.split('/')[2]), name = f.nm.value.trim();
  if (!name || !f.purchasedAt.value) { f.nm.value = name; e.target.reportValidity(); return; }
  Object.assign(it, { name, storage: f.storage.value, purchasedAt: f.purchasedAt.value, expiryDate: f.expiryDate.value || null,
    quantity: Number(f.quantity.value) > 0 ? Number(f.quantity.value) : null, unit: f.unit.value.trim(), memo: f.memo.value.trim() });
  save(); render(); toast('저장했어요');
});
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importData(f); });

/* 스와이프: → 소비, ← 폐기 */
let drag = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.swipe .card');
  if (c && e.button === 0) drag = { c, x: e.clientX, y: e.clientY, dx: 0, on: false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (Math.abs(dx) < 10) return;
    drag.on = true;
    drag.c.setPointerCapture(e.pointerId);
    drag.c.classList.add('dragging');
  }
  drag.dx = dx;
  drag.c.style.transform = `translateX(${dx}px)`;
  drag.c.parentNode.dataset.dir = dx > 0 ? 'consume' : 'discard';
});
const endDrag = () => {
  if (!drag) return;
  const { c, dx, on } = drag;
  drag = null;
  if (!on) return;
  suppressClick = true; setTimeout(() => suppressClick = false);
  c.classList.remove('dragging');
  if (Math.abs(dx) > c.offsetWidth * .35) {
    c.style.transform = `translateX(${dx > 0 ? 110 : -110}%)`;
    setTimeout(() => setStatus([c.parentNode.dataset.id], dx > 0 ? 'consumed' : 'discarded'), 180);
  } else {
    c.style.transform = '';
    setTimeout(() => delete c.parentNode.dataset.dir, 200);
  }
};
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('click', e => { if (suppressClick && e.target.closest('.card')) e.preventDefault(); }, true);

/* ---------- 라우팅 ---------- */
function render() {
  const [, page, id] = location.hash.split('/');
  document.body.dataset.page = page || 'home';
  if (page === 'item') detail(id);
  else if (page === 'urgent') urgent();
  else if (page === 'settings') settings();
  else home();
}
addEventListener('hashchange', () => { navigated = true; render(); scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && document.body.dataset.page === 'home') render(); }); // 자정 넘김 반영

(async () => {
  try {
    items = (await get('items')) || [];
    Object.assign(S, await get('settings'));
  } catch { toast('저장소를 열 수 없어요. 개인정보 보호 모드인지 확인해 주세요.'); }
  applyTheme();
  render();
  navigator.storage?.persist?.();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
